[project]
name = "reliable-batch-ingestion"
version = "0.1.0"
description = "Reliable and restart-safe batch ingestion lab for REST, PostgreSQL, and file sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.42,<2",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pyarrow>=22,<24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_lab"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.42,<2",
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["batch_lab"]
mypy_path = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: requires local Docker Compose services",
]
