  - id: BI-100
    title: Remove archived pre-rewrite Git history
    status: done
    depends_on: [BI-099]
    scope:
      - Apply the project owner's explicit decision not to retain the pre-BI-099 commit variation.
      - Delete the archive tag, expire local reflogs, and prune unreachable old-history objects.
      - Preserve the rewritten main branch, product tree, historical audit text, runtime behavior, tests, dependencies, contracts, and ADRs.
