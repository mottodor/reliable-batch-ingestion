  - id: BI-099
    title: Rewrite Git history into cohesive commits
    status: done
    depends_on: [BI-098]
    scope:
      - Preserve the original pre-rewrite history through an explicit archive reference because accepted audit evidence cites exact commit IDs.
      - Replace the largest mixed or multi-task commits with smaller task-focused commits and consistent explanatory messages.
      - Preserve the exact pre-task repository tree, linear topology, historical audit text, product behavior, tests, dependencies, contracts, and ADRs.
