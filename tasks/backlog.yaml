    acceptance:
      - The original c6d4b1537b3deeda0d5d1568db97a27394dfd207 tip remains reachable through refs/tags/archive/pre-bi099-history.
      - Rewritten main has task-focused replacements for the selected BI-050, BI-060, BI-070/080/090, BI-091/092/093, BI-094/095, and BI-096/terminal-closeout commits.
      - Rewritten subjects use a consistent type(scope) outcome style and commit bodies state purpose and scope without inventing validation evidence.
