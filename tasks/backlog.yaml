  - id: BI-007
    title: Documentation information architecture
    status: done
    depends_on: [BI-005]
    scope:
      - Keep only the implementation plan, current state, and append-only worklog as files directly under docs.
      - Group the product specification, shared contracts, and source-specific ingestion documentation by responsibility.
      - Update active links, path-sensitive checks, and future documentation destinations without changing product or architecture contracts.
    acceptance:
      - docs contains only IMPLEMENTATION_PLAN.md, STATE.md, and WORKLOG.md as root-level files.
      - Product, contract, and ingestion documents live under specification, contracts, and ingestion directories respectively.
      - Active repository references and documentation tests use the new paths while historical WORKLOG entries remain unchanged.
      - BI-070 remains the synchronized active task and repository verification passes.

  - id: BI-010
    title: Core deterministic contracts
    status: done
    depends_on: [BI-000]
    scope:
      - Add typed environment configuration without import-time I/O.
      - Add streaming SHA-256 checksum calculation.
      - Define canonical inputs, normalization, and path layout for deterministic batch_id and object keys.
      - Define unique run_id generation.
      - Define typed manifest schema, source-specific nullability, UTC timestamp serialization, cardinality, statuses, transitions, serialization, and validation.
      - Define structured run summary fields from the specification.
      - Document the initial manifest and identifier contract before treating later changes as ADR-governed.
    acceptance:
      - Public functions and models are typed.
      - Identical normalized logical input yields identical batch_id and object key.
      - Different physical attempts yield different run_id values.
      - Manifest includes every required field from docs/specification/batch-ingestion.md with explicit types and source applicability.
      - Manifest cardinality, status transitions, terminal states, and UTC timestamp format are documented and tested.
      - Manifest serialization never includes configured secrets.
      - Unit tests cover determinism, checksum chunking, validation, and status mapping.
      - No network, PostgreSQL, or S3 connection occurs in unit tests or at import time.

  - id: BI-020
    title: Local Compose infrastructure
    status: done
    depends_on: [BI-010]
    scope:
      - Add Compose services using postgres:17.6-bookworm and dxflrs/garage:v2.4.1; the mock API remains in BI-040.
      - Add separate named volumes for PostgreSQL data, Garage metadata, and Garage object data.
      - Reuse the typed POSTGRES_* and S3_* environment contract, with runtime credentials loaded from ignored .env values.
      - Add bounded PostgreSQL and Garage healthchecks and wait for readiness without arbitrary sleeps.
      - Bootstrap Garage single-node layout, configured access credentials, and the configured bucket idempotently.
      - Add make up, down, logs, seed, integration, reset, and explicitly confirmed destructive-reset targets.
      - Add bounded integration checks for service health, repeat bootstrap, down/up persistence, and reset behavior.
      - Document local setup, lifecycle semantics, seed scope, health inspection, and destructive reset.
    acceptance:
      - docker compose --env-file .env.example config --quiet passes and only patch-level pinned images are used.
      - make up requires ignored .env configuration and reaches healthy PostgreSQL and Garage services within an explicit timeout.
      - Repeated make seed preserves the configured Garage bucket, credentials, and an existing sentinel object.
      - PostgreSQL and Garage sentinel data survive make down followed by make up.
      - make down never removes named volumes.
      - make reset warns and exits without deleting data; volume deletion requires a separately named destructive target and an exact confirmation token.
      - A confirmed destructive reset removes both services' persisted data, and the next startup recreates only the configured infrastructure.
      - No committed file contains real credentials; runtime credentials come from ignored .env values.
      - Infrastructure integration tests use the standard S3 API where applicable, use bounded waits, and pass against the local stack.
      - README commands and behavior match the implemented lifecycle.

  - id: BI-030
    title: Shared S3 storage boundary
    status: done
    depends_on: [BI-020]
    scope:
      - Extend typed storage configuration with explicit S3 attempt and socket-timeout bounds.
      - Implement configured path-style SigV4 boto3 client construction with standard retries.
      - Implement streamed deterministic immutable write and byte-level SHA-256 verification.
      - Implement recoverable copy-verify-delete movement with metadata preservation.
      - Implement read-only payload/manifest reconciliation for explicit deterministic keys.
      - Document storage outcomes, failure states, recovery, and the single-writer limitation.
    acceptance:
      - Core S3 operations and path-style client behavior pass against Garage through the standard API.
      - Rewriting identical content is idempotent and verifies streamed bytes without treating ETag as SHA-256.
      - Existing different content at the same deterministic key is a conflict and the original bytes remain unchanged.
      - Move deletes the source only after verified copy; source-only, both-identical, and destination-only states converge on retry.
      - Reconciliation distinguishes absent, payload-only, complete, manifest-only, and corrupt/conflicting states without mutating them.
      - S3 attempts, connect timeouts, and read timeouts are explicit and bounded; endpoint failure is covered deterministically.
      - Unit tests use no external services, integration tests use local Garage, and no connection occurs at import time.

  - id: BI-040
    title: Deterministic source generators and fixtures
    status: done
    depends_on: [BI-020]
    scope:
      - Define one validated SOURCE_SEED contract and deterministic, time-independent OmniRetail record generation.
      - Add versioned PostgreSQL order schema and transactional repeatable seed SQL, invoked explicitly by make seed.
      - Add a Compose-hosted paginated mock REST API for FX rates and shipping statuses with isolated bounded fault injection.
      - Generate and commit valid, empty, schema-invalid, mixed-row, same-name duplicate, and renamed-content CSV, JSON, and Parquet fixtures.
      - Document source schemas, seed behavior, fault selection, fixture byte-stability boundaries, and regeneration commands.
    acceptance:
      - SOURCE_SEED=20260901 reproduces the same ordered logical records for PostgreSQL, API, and supplier sources; invalid seeds fail before state changes and a different seed changes data without changing schemas.
      - Applying the PostgreSQL seed twice produces the same explicit-column row count and ordered digest, with unique deterministic UTC updated_at values suitable for bounded snapshot tests.
      - The mock API exposes bounded pagination for FX rates and shipping statuses and returns byte-stable successful pages for the same seed and request.
      - Selectable live fault scenarios prove 429 then success with Retry-After, permanent 500, deterministic malformed JSON, and successful pages before a repeatable partial-run failure.
      - The committed corpus includes valid, empty, and schema-invalid CSV, JSON, and Parquet plus a mixed-row fixture, same-name duplicate deliveries, and byte-identical renamed content.
      - Two temporary generations and the committed default corpus have identical path sets, lengths, checksums, and bytes under the locked toolchain; parsed valid rows and schemas agree across formats.
      - Mock API startup, health, HTTP calls, seed execution, and integration waits are bounded; unit and integration tests use no public network and do not alter unrelated PostgreSQL or S3 state.

  - id: BI-050
    title: REST API ingestion and backfill
    status: done
    depends_on: [BI-030, BI-040]
    scope:
      - Implement pagination, timeouts, bounded backoff, Retry-After, and error classification.
      - Persist each raw page and a logical-run manifest.
      - Resume partial runs and support inclusive date-range backfill.
      - Expose strict single-date and backfill CLI commands with structured output and stable exit codes.
    acceptance:
      - 429 then success is recovered within retry budget.
      - Permanent 500 exhausts retry budget with explicit status.
      - Permanent 4xx is not retried.
      - Malformed page payload is preserved and failure is traceable.
      - Repeated successful run/backfill creates no uncontrolled duplicate objects.

  - id: BI-060
    title: File ingestion
    status: done
    depends_on: [BI-030, BI-040]
    scope:
      - Define deterministic file identity plus landing, raw, archive, rejected, and rejection-diagnostic contracts without changing manifest schema version 1.
      - Validate allowed source, file name/date, expected checksum, format, schema, required values, strict types, business rules, emptiness, and bounded record counts for CSV, JSON, and Parquet.
      - Implement ADR 0002 whole-file atomicity, preserving exact original bytes before validation and publishing no accepted subset from an invalid file.
      - Distinguish same-name redelivery from identical content under a new name without creating another canonical business-data copy.
      - Expose bounded run/resume CLI flows and recover landing to archive or rejected movement through shared S3 primitives.
    acceptance:
      - CSV, JSON, and Parquet happy paths archive exact bytes, leave no landing object, and create one strict succeeded raw manifest.
      - Empty, malformed, schema-invalid, checksum-mismatched, and business-invalid input is retained byte-for-byte under raw and rejected keys with a stable machine-readable primary reason.
      - A parseable mixed file publishes no accepted rows and reports whole-file counters required by ADR 0002.
      - Same-name duplicate and same content under a new name have distinct structured classifications while preserving one canonical raw payload, final disposition, and original manifest.
      - Failure after verified copy but before landing deletion leaves inspectable identical objects; resume converges to destination-only without data loss or overwrite.
      - File/record/batch/diagnostic bounds, structured summaries, stable CLI exits, recovery commands, and the sequential-writer limitation are documented and tested.

  - id: BI-070
    title: PostgreSQL bounded snapshot ingestion
    status: done
    depends_on: [BI-030, BI-040]
    scope:
      - Define deterministic daily descriptors, chunk identity/keys, strict order schema, bounded configuration, and secret-free observability contracts.
      - Extract explicit columns using bounded pages or a server-side cursor.
      - Capture consistent upper bound and watermark.
      - Persist chunks without retaining the entire snapshot in memory.
      - Resume safely after a connection interruption.
    acceptance:
      - No SELECT star exists in snapshot queries.
      - Memory use is bounded by configured chunk size plus serialization overhead.
      - Rows after the captured upper bound are excluded from the current batch.
      - Restart does not corrupt or silently skip the logical snapshot.

  - id: BI-080
    title: Recovery demos and final documentation
    status: done
    depends_on: [BI-050, BI-060, BI-070]
    scope:
      - Add bounded demo-only fault injection at API page, file movement, PostgreSQL chunk/connection, S3 endpoint, and payload-before-manifest boundaries without adding production CLI fault flags.
      - Implement the four specification Make targets, an allow-listed recovery runner, read-only exact inventory inspection, and structured demo summaries over the existing ingestion primitives.
      - Document every mandatory failure with its trigger, expected retained state, normal recovery command or terminal action, final state, and honest delivery limitations.
      - Add explicit ignored local-environment initialization and an isolated clean-export walkthrough with bounded setup, execution, inspection, and cleanup.
      - Keep scenario, report, object-state, artifact-path, and supervised-subprocess contracts allow-listed, secret-free, path-safe, and side-effect-free at import time.
    acceptance:
      - make demo-happy-path, demo-duplicate, demo-api-retry, and demo-bad-file exist, are bounded, emit structured evidence, and pass from an isolated clean export.
      - The warm happy path ingests REST, file, and PostgreSQL sources within three minutes and leaves exact raw payloads, manifests, archived/rejected files, and snapshot chunks available for inspection.
      - Repeated API, snapshot, same-name file, and renamed-content runs preserve canonical key/checksum/manifest inventory and write no new canonical raw bytes.
      - All nine mandatory failures plus API-page and file-move process boundaries have deterministic intermediate-state assertions and use the normal ingestion commands for recovery or safe terminal re-surfacing.
      - Demo reports contain no secrets or payload values, every wait/subprocess/retry is bounded, and isolated cleanup cannot select default-project data.
      - Local environment initialization is explicit, atomic, owner-only, placeholder-limited, idempotent, redacting, and validated before publication.
      - Unit, integration, clean-export, repository-policy, and verification suites pass, and README matches only commands, timings, recovery semantics, and limitations actually validated.

  - id: BI-090
    title: Independent post-completion acceptance audit
    status: done
    depends_on: [BI-080]
    scope:
      - Freeze the exact audited baseline and independently trace every in-scope specification, accepted ADR, and completed-task acceptance requirement through implementation, tests, documentation, and fresh evidence.
      - Re-run bounded offline, isolated Compose, recovery, and clean-export acceptance checks without treating prior plans, state, or worklog claims as proof.
      - Record only actionable correctness, reproducibility, documentation, or safety findings; do not fix findings, start Possible extensions, or add product scope during the audit.
    acceptance:
      - The audit report distinguishes a clean committed checkout from a dirty working-tree export and records revision, source inventory, tool versions, commands, outcomes, and cleanup evidence.
      - Every in-scope requirement has exact traceability to implementation, tests, documentation, and fresh PASS, FAIL, BLOCKED, or NOT RUN evidence.
      - The audit records prioritized findings with exact authority and evidence, or explicitly records that no findings were identified.
      - Any required follow-up is decomposed into a separate bounded maintenance task before implementation; completed product tasks are not reopened implicitly.
      - Audit execution changes no product code, tests, dependencies, contracts, or ADRs, and the backlog/state handoff remains synchronized.

  - id: BI-091
    title: Decide the REST logical-run manifest contract
    status: done
    depends_on: [BI-090]
    scope:
      - Resolve BI-090-F02 with an ADR before any implementation changes.
      - Compare page-set summaries, changed page manifests, synthetic payloads, per-attempt aggregates, and one deterministic API-specific aggregate against immutability and replay requirements.
      - Define aggregate REST logical-run manifest cardinality, deterministic identity and key placement, strict bounded schema/versioning, exact page linkage, completion publication order, terminal states, reconciliation, and replay semantics.
      - Preserve immutable page payloads/manifests and the sequential-writer limitation; do not implement, migrate, test, or write the selected runtime contract in this task.
    acceptance:
      - An accepted ADR explicitly resolves the specification requirement for a complete logical-run manifest and compares bounded alternatives.
      - The decision defines the exact deterministic key, aggregate cardinality and fields, independent schema/version strategy, canonical serialization and byte bound, page linkage, and completion criteria.
      - The decision defines absent, incomplete, complete, corrupt/conflicting, orphaned, and uncertain-write behavior plus replay compatibility with existing page evidence and mixed page run IDs.
      - The decision preserves schema-version-1 page manifests, raw bytes, standard-S3 access, sequential-writer semantics, and the prohibition on exactly-once claims.
      - BI-092 is refined against the accepted decision without changing runtime behavior, tests, dependencies, current-behavior documentation claims, or existing stored evidence in BI-091.

  - id: BI-092
    title: Persist and reconcile REST logical-run manifests
    status: done
    depends_on: [BI-091]
    scope:
      - Implement the separate strict api_logical_run_manifest schema version 1, canonical serializer/parser, deterministic logical-run key helper, and 8 MiB declared/actual byte bounds accepted in ADR 0003.
      - Add bounded exact-key inspection that streams and verifies aggregate, raw-page, and page-manifest bytes and checksums without treating ETag or prefix listing as completeness evidence.
      - Publish exactly one immutable success-only aggregate after every required schema-version-1 page pair satisfies the completion predicate and before the terminal success event and final RunSummary.
      - Reconcile absent, incomplete, failed, eligible, complete, corrupt, conflicting, orphaned, and uncertain-write states without rewriting or deleting retained evidence.
      - Upgrade legacy page-only batches during normal replay, support mixed page-manifest run IDs, and keep backfill on the same fail-fast single-date primitive.
      - Update focused unit and Garage integration tests, exact inventory/demo inspection, REST/backfill operator documentation, and compatibility wording without changing existing metric meanings or delivery claims.
    acceptance:
      - The aggregate model and key helper enforce the exact ADR 0003 fields, identity rederivation, key examples, canonical bytes, duplicate-key rejection, ordered gap-free page linkage, count relationships, 9,999-page maximum, and separate 8 MiB declared/actual read limit.
      - A successful logical REST run leaves exactly N immutable raw pages, N unchanged schema-version-1 page manifests, and one verified aggregate at the deterministic logical-batch key; aggregate verification precedes terminal success output.
      - Partial, interrupted, and failed runs never publish completion; an eligible or legacy page-only run converges to one aggregate without duplicating or mutating existing raw pages or page manifests.
      - Complete replay, including mixed page-manifest run IDs, validates and reuses the original aggregate bytes, completion_run_id, and completed_at while preserving raw-only bytes_written and existing duplicate_count meanings.
      - Every ADR 0003 reconciliation state has a stable tested outcome; corrupt, conflicting, or orphaned aggregates fail visibly and remain unchanged, while uncertain writes reuse fully valid bytes or retry the same frozen bytes only when the key is absent.
      - Checksums for raw payloads, exact stored page-manifest bytes, and aggregate bytes come from streamed content rather than ETag, and reconciliation depends only on exact derived keys.
      - Unit tests cover strict schema/type/version validation, noncanonical and duplicate JSON members, identity/key derivation, serialization, page ordering/linkage, count/boundary relationships, byte limits, maximum cardinality, publication order, and every reconciliation row.
      - Garage integration covers first creation, complete replay, interruption after the final page manifest, uncertain-write recovery, malformed/conflicting/orphaned aggregate states, legacy page-only upgrade, and mixed-run page evidence without rewriting prior bytes.
      - Each successful backfill date and exact inventory/demo inspection requires one valid aggregate, and API/backfill documentation describes recovery and compatibility using standard-S3, sequential-writer, idempotent-redelivery semantics without an exactly-once claim.

  - id: BI-093
    title: Emit terminal summaries for backend storage failures
    status: done
    depends_on: [BI-092]
    scope:
      - Resolve BI-090-F03 by translating raw Botocore failures at the shared storage boundary and normalizing them at the REST, file, and PostgreSQL snapshot service attempt boundaries.
      - Bring S3 session setup and file landing staging inside source-owned attempts so stable trace identifiers exist before backend work and exactly one source terminal failure event plus final RunSummary is emitted.
      - Preserve exception chaining, confirmed-only metrics, stable CLI exit categories, and all existing retained-evidence and recovery semantics.
      - Add focused offline and isolated unavailable-S3 coverage without swallowing programming errors, duplicating terminal output, or exposing secret/backend values.
    acceptance:
      - S3 session setup, inspection, read, copy, delete, and write failures in each source path emit one terminal event and one final summary with all required metrics and stable trace identifiers.
      - Events, summaries, CLI output, and demo reports contain no credentials, DSNs, payload or row values, endpoint/backend exception text, or duplicate terminal records.
      - Handled source exceptions preserve the backend failure as a chained cause; unexpected non-storage defects retain their runtime classification.
      - Existing retained evidence, object/manifest contracts, bounded retries, and retry/recovery semantics remain unchanged, and focused unit plus isolated local integration tests pass.

  - id: BI-094
    title: Enforce the REST total response deadline
    status: done
    depends_on: [BI-090]
    scope:
      - Resolve BI-090-F04 by enforcing the configured monotonic elapsed deadline while streaming successful HTTP response bodies.
      - Retain the response-byte ceiling, per-operation HTTPX timeouts, bounded retries, raw-before-parse ordering, and context-owned spool cleanup.
      - Add deterministic slow-trickle tests that do not use arbitrary sleeps or the public network.
    acceptance:
      - A peer that yields bytes below the read-timeout threshold cannot keep response consumption alive beyond the configured total elapsed budget.
      - Deadline failure has the existing stable handled classification, closes response/spool resources, persists no incomplete raw page, and emits the required terminal output.
      - Normal chunked responses, 429 handling, retry budgets, malformed-body preservation, and live API ingestion continue to pass.

  - id: BI-095
    title: Align local preflight with application configuration
    status: done
    depends_on: [BI-090]
    scope:
      - Resolve BI-090-F05 by making initialization/preflight and README claims cover the same configuration surface.
      - Reuse a redacting full-application validation path for HTTP, file, PostgreSQL, snapshot, logging, and S3 settings before atomic environment publication.
      - Preserve owner-only, placeholder-limited, symlink-safe, idempotent initialization and never print generated values.
    acceptance:
      - Preflight rejects missing, malformed, or cross-field-invalid application settings that would make AppConfig loading fail.
      - Initialization publishes nothing when full validation fails and remains byte-stable on a valid rerun.
      - Tests cover omitted HTTP, file, PostgreSQL, snapshot, logging, and S3 settings plus redaction, and README exactly matches the validated surface.

  - id: BI-096
    title: Attest clean-commit core reproducibility
    status: done
    depends_on: [BI-090]
    scope:
      - Resolve the remaining BI-090-F01 follow-up by validating the completed audited source set from an exact named clean committed checkout.
      - Run the bounded clean-export walkthrough and repository gates without copying uncommitted product or audit files into the source set.
      - Record revision, clean status, commands, timings, exact inspection, cleanup, and protected-resource evidence without changing product behavior.
    acceptance:
      - The named revision contains every required snapshot, demo, clean-export, test, and operator-document path and begins with an empty Git status.
      - The clean-checkout walkthrough passes locked setup, doctor, Compose rendering, seed, all four demos, offline tests, exact final inspection, and bounded cleanup.
      - Audit-owned resources are absent afterward, protected fingerprints are unchanged, and the evidence does not reclassify or erase BI-090's original dirty baseline.

  - id: BI-097
    title: Move the session entry point under docs
    status: done
    depends_on: [BI-096]
    scope:
      - Move the repository navigation entry point from START_HERE.md to docs/START_HERE.md.
      - Update active instructions, links, and path-sensitive checks without changing product behavior or architectural contracts.
      - Synchronize project state and append completion evidence to the worklog.
    acceptance:
